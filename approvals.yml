name: Approve and Publish

on:
  workflow_dispatch:            # the Cloudflare worker starts this the moment you tap a button
    inputs:
      update:
        description: "Telegram update (sent by the worker)"
        required: false
        default: ""
  schedule:
    - cron: "12,42 * * * *"      # safety net: collects anything the instant path missed

permissions:
  contents: write

concurrency:
  group: south-cinema-bot       # shared with the main bot workflow so they never overlap
  cancel-in-progress: false

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Pillow + numpy (cards and Reels)
        run: pip install Pillow==10.4.0 numpy==2.1.3

      - name: Make sure ffmpeg is available (for Reels)
        run: command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Process approvals
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MONTHLY_CAP_USD: ${{ vars.CLAUDE_MONTHLY_CAP_USD || '12' }}
          USE_CLAUDE: ${{ vars.USE_CLAUDE || '0' }}
          USE_ARTICLE_IMAGES: ${{ vars.USE_ARTICLE_IMAGES || '1' }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          TELEGRAM_UPDATE: ${{ github.event.inputs.update }}
        run: python3 approvals.py

      - name: Save approval status
        run: |
          git config user.name "southcinema-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -e pending.json ]; then git add -A pending.json; fi
          if [ -e claude_usage.json ]; then git add -A claude_usage.json; fi
          if [ -d graphics ]; then git add -A graphics; fi
          if [ -d reels ]; then git add -A reels; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update approval status [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi

      - name: Tell me if this failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ Approve/Publish failed. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
