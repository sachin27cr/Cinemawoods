name: South Cinema News Bot

on:
  schedule:
    # BACKUP schedule, 10 minutes after each slot (7:00, 11:00, 14:00, 17:00, 20:00 IST). The Cloudflare Worker's
    # Cron Trigger starts the run on time; this one only acts if that run did not produce drafts.
    - cron: "40 1 * * *"
    - cron: "40 5 * * *"
    - cron: "40 8 * * *"
    - cron: "40 11 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch:      # manual run from the Actions tab, or /news in Telegram
    inputs:
      count:
        description: "How many drafts to make (blank = default)"
        required: false
        default: ""
      scheduled:
        description: "Set by the Worker's timer (skips if drafts were just made)"
        required: false
        default: ""


permissions:
  contents: write   # lets the bot save drafts, cards and its post log in the repo

concurrency:
  group: south-cinema-bot       # shared with the approvals workflow so they never overlap
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # the newest main when the run actually starts - not the older snapshot from when it was queued,
          # otherwise this run would overwrite (or fail to save over) the run that finished just before it
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed self-test
        run: python fetch_news.py

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MONTHLY_CAP_USD: ${{ vars.CLAUDE_MONTHLY_CAP_USD || '12' }}
          USE_CLAUDE: ${{ vars.USE_CLAUDE || '0' }}
          SCHEDULED_RUN: ${{ github.event.inputs.scheduled }}
          RUN_EVENT: ${{ github.event_name }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW: ${{ vars.TELEGRAM_REVIEW || '1' }}
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.count || vars.MAX_POSTS_PER_RUN || '5' }}
          USE_ARTICLE_IMAGES: ${{ vars.USE_ARTICLE_IMAGES || '1' }}
        run: python main.py

      - name: Save drafts and post log
        run: |
          git config user.name "southcinema-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in posted_log.db graphics reels pending.json claude_usage.json; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update drafts and post log [skip ci]"
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin ${{ github.ref_name }} && git push; then exit 0; fi
              echo "save attempt $attempt failed, retrying"
              git rebase --abort 2>/dev/null || true
              sleep $((attempt * 5))
            done
            exit 1
          fi

      - name: Tell me if the run failed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ The Cinema Woods news run failed. Details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > /dev/null
