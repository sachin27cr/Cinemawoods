name: South Cinema News Bot

on:
  schedule:
    # Runs at 6:30, 11:30, and 17:30 IST (01:00, 06:00, 12:00 UTC)
    - cron: "0 1 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # lets the bot save drafts, cards and its post log in the repo

concurrency:
  group: south-cinema-bot       # shared with the approvals workflow so they never overlap
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feed self-test
        run: python fetch_news.py

      - name: Run bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW: ${{ vars.TELEGRAM_REVIEW || '1' }}
          MAX_POSTS_PER_RUN: ${{ vars.MAX_POSTS_PER_RUN || '3' }}
        run: python main.py

      - name: Save drafts and post log
        run: |
          git config user.name "southcinema-bot"
          git config user.email "bot@users.noreply.github.com"
          for p in posted_log.db graphics pending.json; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update drafts and post log [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
