name: Approve and Publish

on:
  schedule:
    - cron: "*/15 * * * *"   # checks Telegram for Approve/Reject taps every ~15 minutes
  workflow_dispatch: {}      # run it by hand right after you tap, if you don't want to wait

permissions:
  contents: write

concurrency:
  group: south-cinema-bot       # shared with the main bot workflow so they never overlap
  cancel-in-progress: false

jobs:
  publish-approved:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Pillow (needed to build poster cards)
        run: pip install Pillow==10.4.0

      - name: Process approvals
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 approvals.py

      - name: Save approval status
        run: |
          git config user.name "southcinema-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -e pending.json ]; then git add -A pending.json; fi
          if [ -d graphics ]; then git add -A graphics; fi
          if ! git diff --cached --quiet; then
            git commit -m "Update approval status [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }}
            git push
          fi
